{% extends "base.html" %}

{% block page_title %}Player Search{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Player Search</h2>
        <p class="text-sm text-slate-500 mt-0.5">Browse and search all players across your teams</p>
    </div>

    <!-- Search & Filter Bar -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1 relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input
                    type="text"
                    id="player-page-search"
                    name="q"
                    placeholder="Search by name…"
                    class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none"
                    hx-get="/api/players/list"
                    hx-trigger="keyup changed delay:300ms, load"
                    hx-target="#player-table-body"
                    hx-swap="innerHTML"
                    hx-include="#position-filter, #team-filter"
                    autocomplete="off"
                >
            </div>
            <select
                id="position-filter"
                name="position"
                class="px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none bg-white"
                hx-get="/api/players/list"
                hx-trigger="change"
                hx-target="#player-table-body"
                hx-swap="innerHTML"
                hx-include="#player-page-search, #team-filter"
            >
                <option value="">All Positions</option>
                <option value="QB">QB</option>
                <option value="RB">RB</option>
                <option value="WR">WR</option>
                <option value="TE">TE</option>
                <option value="K">K</option>
                <option value="DEF">DEF</option>
            </select>
            <select
                id="team-filter"
                name="nfl_team"
                class="px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none bg-white"
                hx-get="/api/players/list"
                hx-trigger="change"
                hx-target="#player-table-body"
                hx-swap="innerHTML"
                hx-include="#player-page-search, #position-filter"
            >
                <option value="">All NFL Teams</option>
                {% for nfl_team in nfl_teams %}
                <option value="{{ nfl_team }}">{{ nfl_team }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- Results Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <th class="px-6 py-3">Player</th>
                        <th class="px-6 py-3">Pos</th>
                        <th class="px-6 py-3">NFL Team</th>
                        <th class="px-6 py-3">Fantasy Team</th>
                        <th class="px-6 py-3 text-right">Projected</th>
                        <th class="px-6 py-3 text-right">Actual</th>
                    </tr>
                </thead>
                <tbody id="player-table-body" class="divide-y divide-slate-100">
                    <!-- Filled by HTMX -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
