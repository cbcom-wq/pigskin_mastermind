<!-- Team Create / Edit Modal -->
<div class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden" onclick="event.stopPropagation()">
        <!-- Header -->
        <div class="field-pattern px-6 py-4">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Create New Team</h3>
                <button onclick="this.closest('.fixed').remove()"
                        class="text-white/70 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Form -->
        <form hx-post="/teams" hx-swap="none" class="p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Team Name <span class="text-red-400">*</span>
                    </label>
                    <input
                        type="text"
                        name="name"
                        required
                        class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none transition-all"
                        placeholder="e.g. Gridiron Geniuses"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Owner Name <span class="text-red-400">*</span>
                    </label>
                    <input
                        type="text"
                        name="owner"
                        required
                        class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none transition-all"
                        placeholder="Your name"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        League ID <span class="text-slate-400 font-normal">(optional)</span>
                    </label>
                    <input
                        type="text"
                        name="league_id"
                        class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-field-500 focus:border-field-500 outline-none transition-all"
                        placeholder="ESPN league ID for imports"
                    >
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button
                    type="submit"
                    class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-gradient-to-r from-field-600 to-field-700 hover:from-field-700 hover:to-field-800 text-white text-sm font-semibold rounded-lg shadow-sm transition-all"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Create Team
                </button>
                <button
                    type="button"
                    onclick="this.closest('.fixed').remove()"
                    class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition-colors"
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
